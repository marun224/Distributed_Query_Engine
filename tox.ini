# `uv run tox` -- lint, type-check, test against the built wheel, then cut a distribution.
#
# The suite runs against the *installed wheel*, not py_src/, so anything that works from
# the source tree but is missing from the package fails here rather than after a release.
#
#   uv run tox                  every env below, in order
#   uv run tox -e py312         just the tests
#   uv run tox -e integration   opt-in, needs the dev REST catalog + MinIO up
#   uv run tox -- -k splits     arguments after `--` go to pytest

[tox]
requires =
    tox>=4.21
    tox-uv>=1.16
env_list = lint, type, py312, dist
# The dev container sets TOX_WORK_DIR=/cache/tox so its Linux envs never share the Windows
# .tox/ on the mounted repo (PLAN decision 28). Elsewhere this is the default .tox/.
work_dir = {env:TOX_WORK_DIR:{tox_root}/.tox}

# `python -m <tool>` rather than the tool's own .exe: the dev machine runs Windows Smart App
# Control in enforce mode, which blocks unsigned launchers it has no reputation for
# (mypy.exe is one). The module form runs the same code through the signed interpreter.
[testenv]
description = Run the test suite against the built wheel
package = wheel
wheel_build_env = .pkg
extras = dev
commands = python -m pytest {posargs}

[testenv:lint]
description = ruff lint + format check
skip_install = true
deps = ruff
commands =
    python -m ruff check .
    python -m ruff format --check .

[testenv:type]
description = mypy over py_src/ and py_test/ (paths come from pyproject)
extras = dev
commands = python -m mypy

[testenv:dist]
description = Build the sdist and wheel into dist/
skip_install = true
deps = uv
commands =
    python -c "import pathlib; [f.unlink() for f in pathlib.Path('dist').glob('icefleet-*')]"
    uv build --out-dir dist
    python -c "import pathlib; print('built:', ', '.join(sorted(f.name for f in pathlib.Path('dist').glob('icefleet-*'))))"

[testenv:integration]
description = Integration tests against the dev REST catalog + MinIO (opt-in, fast tier)
extras = dev
passenv =
    ICETL_*
    ICEFLEET_*
    AWS_*
commands = python -m pytest -m "integration and not slow" {posargs}

[testenv:integration_slow]
description = The full integration suite, including the real-scale scans (opt-in, minutes)
extras = dev
passenv =
    ICETL_*
    ICEFLEET_*
    AWS_*
commands = python -m pytest -m integration {posargs}
